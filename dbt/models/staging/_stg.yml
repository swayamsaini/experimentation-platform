version: 2
models:
  - name: stg_orders
    description: "One row per order with typed timestamps and normalised status."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['created','approved','invoiced','processing','shipped','delivered','canceled','unavailable']
  - name: stg_order_items
    description: "One row per order line item."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
  - name: stg_payments
    columns: [{name: order_id, data_tests: [unique, not_null]}]
  - name: stg_reviews
    columns: [{name: order_id, data_tests: [unique, not_null]}]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_sellers
    columns: [{name: seller_id, data_tests: [unique, not_null]}]
  - name: stg_products
    columns: [{name: product_id, data_tests: [unique, not_null]}]
  - name: stg_geolocation
    columns: [{name: zip_prefix, data_tests: [unique, not_null]}]
